<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distribución de Trabajo</title>
    <meta
      name="description"
      content="Distribución de Trabajo — administración de la asignación mensual de horas por proyecto."
    />
    <script>
      // Aplica el tema guardado antes del primer paint para evitar flash.
      try {
        var saved = localStorage.getItem("sabana-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
